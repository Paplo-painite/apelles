[package]
name = "apelles-io"
description = "Import/export between apelles documents and PSD/PSB and flat raster formats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# HEIC/HEIF decode (forwarded to apelles-codecs; see its `heif` feature).
heif = ["apelles-codecs/heif"]

[dependencies]
apelles-geom = { workspace = true }
apelles-color = { workspace = true }
apelles-cms = { workspace = true }
apelles-raster = { workspace = true }
apelles-doc = { workspace = true }
apelles-compose = { workspace = true }
apelles-algo = { workspace = true }
apelles-psd = { workspace = true }
apelles-codecs = { workspace = true }
apelles-raw = { workspace = true }
apelles-affinity = { workspace = true }
apelles-text = { workspace = true }
apelles-paint = { workspace = true }
apelles-vector = { workspace = true }
apelles-format = { path = "../format" }
thiserror = { workspace = true }
serde_json = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
# svg.rs inflates `.svgz` itself (with a size cap) so the XML can be checked before it is parsed;
# pdn.rs inflates Paint.NET's gzip pixel chunks.
flate2 = { workspace = true }
# SVG import (svg.rs): usvg parses, resvg rasterises what the shape model can't hold. Both are
# already in the tree through the UI's icon loader; text shaping needs the fonts feature set.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }

[dev-dependencies]
crc32fast = "1.5"
apelles-affinity = { workspace = true, features = ["synth"] }
flate2 = { workspace = true }
apelles-psd = { workspace = true, features = ["testgen"] }
apelles-raw = { workspace = true, features = ["testgen"] }
proptest = { workspace = true }
