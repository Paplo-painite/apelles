[package]
name = "apelles-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
apelles-geom = { workspace = true }
apelles-color = { workspace = true }
apelles-cms = { workspace = true }
apelles-raster = { workspace = true }
apelles-doc = { workspace = true }
apelles-compose = { workspace = true }
apelles-gpu = { workspace = true }
apelles-engine = { workspace = true }
apelles-io = { workspace = true }
apelles-plugins = { workspace = true }
apelles-algo = { workspace = true }
apelles-text = { workspace = true }
apelles-vector = { workspace = true }
# Only MAX_BRUSH_SIZE: `ui.set brushSize` validates against the Brush Settings range up front.
apelles-paint = { workspace = true }
# Reading files to open them (bounded reads, a clear error for files larger than memory).
apelles-format = { workspace = true }
# Decoding the brand mark's PNG (`brand.rs`); already linked through apelles-io.
apelles-codecs = { workspace = true }
egui = { workspace = true }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
base64 = "0.22"
# Edit › Keyboard Shortcuts › Import Photoshop Shortcuts… reads Photoshop's `.kys` XML
# (already in the tree through egui_extras → resvg → usvg).
roxmltree = "0.20"
# Inflating the translation catalogs, stored deflated (build.rs); already linked through apelles-io.
flate2 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
# Safe native UI-language APIs (Windows/macOS); no subprocess or web dependency.
sys-locale = "=0.3.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { workspace = true, features = ["accesskit"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["android-native-activity"] }

[dev-dependencies]
# Synthetic raw files for the open-time Camera Raw dialog tests.
apelles-raw = { workspace = true, features = ["testgen"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
# Benchmark helpers for the `--json` benches `cargo xtask perf` runs (in-process RSS, percentiles).
apelles-testkit = { workspace = true }
# Only for examples/perf_scenarios.rs (a 500-brush .abr for the #210 import row).
apelles-psd = { workspace = true }

[build-dependencies]
# Deflates the translation catalogs (build.rs); already linked at run time to inflate them.
flate2 = { workspace = true }
serde_json = { workspace = true }
toml = "1"
