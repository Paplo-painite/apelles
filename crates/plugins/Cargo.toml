[package]
name = "apelles-plugins"
description = "Sandboxed WebAssembly filter plug-ins: a resource-limited wasmi host for the Apelles plug-in ABI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
apelles-geom = { workspace = true }
apelles-color = { workspace = true }
apelles-raster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc"] }
# Pure-Rust WebAssembly interpreter (MIT OR Apache-2.0). Without `wat` (text parsing is test-only)
# and memory64; `validate` keeps full module validation on.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "stable", "portable-dispatch"] }

# Bands run in parallel on native; wasm builds stay single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
# WebAssembly text -> binary for the hostile-module fixtures (Apache-2.0 WITH LLVM-exception).
wat = "1.228"
