[package]
name = "apelles-cli"
description = "Headless Apelles: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional apelles-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["apelles-codecs/heif"]

[lints]
workspace = true

[lib]
name = "apelles_cli"
path = "src/lib.rs"

[[bin]]
name = "apelles-cli"
path = "src/main.rs"

[dependencies]
apelles-automation = { path = "../../crates/automation" }
apelles-engine = { workspace = true }
apelles-io = { workspace = true }
apelles-format = { path = "../../crates/format" }
apelles-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for apelles-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

