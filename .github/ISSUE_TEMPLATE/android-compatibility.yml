name: Android compatibility issue
description: Report an Apelles problem on a specific Android device
title: "Android: "
labels:
  - android
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not attach private images or projects unless you have removed sensitive content.
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: Google Pixel 8, Samsung Galaxy S23, emulator...
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: Android 14
    validations:
      required: true
  - type: input
    id: abi
    attributes:
      label: ABI
      placeholder: arm64-v8a or x86_64
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Apelles version
      placeholder: v0.6.0-apelles-android
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe the exact actions that cause the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Remove personal data and private file paths before posting logs.
    validations:
      required: true
